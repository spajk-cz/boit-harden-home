name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write   # kvuli vytvoreni Release pri tagu

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish single-file EXE
        run: >
          dotnet publish gui/BoitHardenHome.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -o publish

      - name: SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/BoitHardenHome.exe -Algorithm SHA256).Hash
          "$hash  BoitHardenHome.exe" | Out-File -Encoding ascii publish/BoitHardenHome.exe.sha256
          Write-Host "SHA256: $hash"

      # Pri kazdem pushi: build je ke stazeni jako artifact (pro vyvoj/testovani)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoitHardenHome-exe
          path: |
            publish/BoitHardenHome.exe
            publish/BoitHardenHome.exe.sha256

      # Pri tagu v* : vytvori verejny Release s .exe ke stazeni jednim klikem
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: BOIT Harden Home ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            publish/BoitHardenHome.exe
            publish/BoitHardenHome.exe.sha256
