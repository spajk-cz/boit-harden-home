name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write   # kvuli vytvoreni/aktualizaci Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish single-file EXE
        run: >
          dotnet publish gui/BoitHardenHome.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -o publish

      - name: SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/BoitHardenHome.exe -Algorithm SHA256).Hash
          "$hash  BoitHardenHome.exe" | Out-File -Encoding ascii publish/BoitHardenHome.exe.sha256
          Write-Host "SHA256: $hash"

      # Build je i jako artifact (pro vyvoj/testovani)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoitHardenHome-exe
          path: |
            publish/BoitHardenHome.exe
            publish/BoitHardenHome.exe.sha256

      # Pri kazdem pushi do main: vytvori/aktualizuje verejny Release "latest"
      # s .exe ke stazeni jednim klikem. Release zaklada primo GitHub Actions
      # (server-side), neni potreba pushovat tagy z klienta.
      - name: Publish Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: BOIT Harden Home – nejnovější verze
          body: |
            Nejnovější sestavení aplikace BOIT Harden Home.

            **Stáhněte `BoitHardenHome.exe` níže a spusťte.** Není potřeba nic instalovat.
            Kontrolní součet je v souboru `BoitHardenHome.exe.sha256`.

            Děláme #BezpečnějšíČesko
          draft: false
          prerelease: false
          make_latest: true
          files: |
            publish/BoitHardenHome.exe
            publish/BoitHardenHome.exe.sha256
